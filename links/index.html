<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0E46D4;--blue-hi:#0538B9;--gold:#FFB400;
  --ink:#0b1220;--muted:#64748b;--line:#d9e1ee;
  --bg:#f5f8fc;--card:#ffffff;--chip:#eaf0fb;
}
html{background:var(--bg)}
body{
  font-family:'Heebo',system-ui,-apple-system,sans-serif;
  background:radial-gradient(900px 480px at 50% -220px,rgba(14,70,212,.12),transparent 70%),var(--bg);
  color:var(--ink);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 32px;-webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}
.avatar{width:92px;height:92px;border-radius:50%;padding:3px;background:var(--card);
  box-shadow:0 0 0 3px var(--blue),0 10px 28px rgba(14,70,212,.16)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{font-family:'Cabinet Grotesk','Heebo',sans-serif;font-weight:800;font-size:1.8rem;
  letter-spacing:-.01em;margin-top:14px;direction:ltr}
.tag{margin-top:4px;color:var(--muted);font-size:.95rem;font-weight:500}
.socials{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.socials a{width:40px;height:40px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--line);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(11,18,32,.04);
  transition:transform .15s,background .15s,color .15s,border-color .15s}
.socials a svg{width:20px;height:20px;display:block}
.socials a:hover,.socials a:focus-visible{background:var(--blue);border-color:var(--blue);color:#fff;transform:translateY(-2px);outline:none}
.actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:28px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--blue);color:#fff;border-radius:999px;padding:16px 20px;
  text-decoration:none;font-weight:700;font-size:1.05rem;
  box-shadow:0 10px 26px rgba(14,70,212,.28);
  transition:background .15s,transform .15s}
.cta:hover{background:var(--blue-hi);transform:translateY(-2px)}
.cta svg{width:20px;height:20px}
.act{display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:14px 20px;text-decoration:none;color:var(--ink);font-weight:700;font-size:1rem;
  box-shadow:0 2px 10px rgba(11,18,32,.04);
  transition:transform .15s,border-color .15s,box-shadow .15s}
.act:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 10px 26px rgba(14,70,212,.14)}
.act svg{width:19px;height:19px;color:var(--blue)}
.recs{width:100%;margin-top:30px}
.recs h2{font-size:.82rem;font-weight:600;color:var(--muted);text-align:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;text-decoration:none;color:var(--ink);
  font-weight:600;font-size:.84rem;line-height:1.4;text-align:center;
  display:flex;align-items:center;justify-content:center;min-height:62px;
  transition:transform .15s,border-color .15s}
.rec:hover{transform:translateY(-2px);border-color:var(--blue)}
footer{margin-top:32px;display:flex;flex-direction:column;align-items:center;gap:8px}
footer img{height:20px;width:auto;display:block;opacity:.85}
footer span{font-size:.75rem;color:var(--muted);direction:ltr}
</style>
